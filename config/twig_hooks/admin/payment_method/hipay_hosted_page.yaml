        'sylius_admin.payment_method.create.content.form.sections.gateway_configuration.hipay_hosted_page':
            account:
                template: '@SyliusHiPayPlugin/admin/payment_method/form/sections/gateway_configuration/account.html.twig'
                priority: 1300
            hosted_page:
                template: '@SyliusHiPayPlugin/admin/payment_method/form/sections/gateway_configuration/hosted_page.html.twig'
                priority: 1150
            product_configurations:
                template: '@SyliusHiPayPlugin/admin/payment_method/form/sections/gateway_configuration/product_configurations.html.twig'
                priority: 1100

        'sylius_admin.payment_method.update.content.form.sections.gateway_configuration.hipay_hosted_page':
            account:
                template: '@SyliusHiPayPlugin/admin/payment_method/form/sections/gateway_configuration/account.html.twig'
                priority: 1300
            hosted_page:
                template: '@SyliusHiPayPlugin/admin/payment_method/form/sections/gateway_configuration/hosted_page.html.twig'
                priority: 1150
            product_configurations:
                template: '@SyliusHiPayPlugin/admin/payment_method/form/sections/gateway_configuration/product_configurations.html.twig'
                priority: 1100
