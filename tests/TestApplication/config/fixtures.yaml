sylius_fixtures:
    suites:
        default:
            fixtures:
                # Neutralize Sylius default orders fixtures
                order:
                    options:
                        amount: 0
                payments:
                    options:
                        percentage_completed: 0
                channel:
                    options:
                        custom:
                            fashion_web_store:
                                name: 'Fashion Web Store'
                                code: 'FASHION_WEB'
                                locales:
                                    - '%locale%'
                                base_currency: 'EUR'
                                currencies:
                                    - 'PLN'
                                    - 'EUR'
                                enabled: true
                                hostname: 'store-eur.%env(resolve:SYLIUS_FIXTURES_HOSTNAME)%'
                                theme_name: '%env(resolve:SYLIUS_FIXTURES_THEME_NAME)%'
                                shop_billing_data:
                                    company: 'HiPay'
                                    tax_id: '0001112222'
                                    country_code: 'FR'
                                    street: '94 rue de Villiers'
                                    city: 'LEVALLOIS-PERRET'
                                    postcode: '92300'
                                menu_taxon: 'MENU_CATEGORY'
                                contact_phone_number: '+41 123 456 789'
                                contact_email: '%env(MAILER_SENDER_EMAIL)%'
                            fashion_pln_web_store:
                                name: 'Fashion Web Store PLN'
                                code: 'FASHION_WEB_PLN'
                                locales:
                                    - '%locale%'
                                base_currency: 'PLN'
                                currencies:
                                    - 'PLN'
                                enabled: true
                                hostname: 'store-pln.%env(resolve:SYLIUS_FIXTURES_HOSTNAME)%'
                                theme_name: '%env(resolve:SYLIUS_FIXTURES_THEME_NAME)%'
                                shop_billing_data:
                                    company: 'HiPay PLN'
                                    tax_id: '0001112222'
                                    country_code: 'PL'
                                    street: '94 rue de Villiers'
                                    city: 'LEVALLOIS-PERRET'
                                    postcode: '92300'
                                menu_taxon: 'MENU_CATEGORY'
                                contact_phone_number: '+41 123 456 789'
                                contact_email: '%env(MAILER_SENDER_EMAIL)%'
                            fashion_omr_web_store:
                                name: 'Fashion Web Store USD'
                                code: 'FASHION_WEB_USD'
                                locales:
                                    - '%locale%'
                                base_currency: 'USD'
                                currencies:
                                    - 'USD'
                                enabled: true
                                hostname: 'store-usd.%env(resolve:SYLIUS_FIXTURES_HOSTNAME)%'
                                theme_name: '%env(resolve:SYLIUS_FIXTURES_THEME_NAME)%'
                                shop_billing_data:
                                    company: 'HiPay USD'
                                    tax_id: '0001112222'
                                    country_code: 'PL'
                                    street: '94 rue de Villiers'
                                    city: 'LEVALLOIS-PERRET'
                                    postcode: '92300'
                                menu_taxon: 'MENU_CATEGORY'
                                contact_phone_number: '+41 123 456 789'
                                contact_email: '%env(MAILER_SENDER_EMAIL)%'
                geographical:
                    options:
                        countries:
                            - 'US'
                            - 'FR'
                            - 'DE'
                            - 'AU'
                            - 'CA'
                            - 'MX'
                            - 'NZ'
                            - 'PT'
                            - 'ES'
                            - 'CN'
                            - 'GB'
                            - 'PL'
                            - 'NL'
                            - 'BE'
                            - 'IT'
                        zones:
                            WORLD:
                                name: 'Rest of the World'
                                countries:
                                    - 'FR'
                                    - 'DE'
                                    - 'AU'
                                    - 'CA'
                                    - 'MX'
                                    - 'NZ'
                                    - 'PT'
                                    - 'ES'
                                    - 'CN'
                                    - 'GB'
                                    - 'PL'
                                    - 'NL'
                                    - 'BE'
                                    - 'US'
                                    - 'IT'
                # HIPASYLU005-8: taxes only apply to the dedicated "basket" products and shipping
                # method below, so existing products and test accounts keep ordering without tax.
                tax_category:
                    # Loaded first: the shipping method fixture runs before it and would not find the category.
                    priority: 10
                    options:
                        custom:
                            hipay_vat_20_excluded:
                                code: 'hipay_vat_20_excluded'
                                name: 'VAT 20% (excluded from price)'
                            hipay_vat_5_5_excluded:
                                code: 'hipay_vat_5_5_excluded'
                                name: 'VAT 5.5% (excluded from price)'
                            hipay_vat_20_included:
                                code: 'hipay_vat_20_included'
                                name: 'VAT 20% (included in price)'
                tax_rate:
                    options:
                        custom:
                            hipay_vat_20_excluded:
                                code: 'hipay_vat_20_excluded'
                                name: 'VAT 20%'
                                zone: 'WORLD'
                                category: 'hipay_vat_20_excluded'
                                amount: 0.2
                                included_in_price: false
                            hipay_vat_5_5_excluded:
                                code: 'hipay_vat_5_5_excluded'
                                name: 'VAT 5.5%'
                                zone: 'WORLD'
                                category: 'hipay_vat_5_5_excluded'
                                amount: 0.055
                                included_in_price: false
                            hipay_vat_20_included:
                                code: 'hipay_vat_20_included'
                                name: 'VAT 20% (incl.)'
                                zone: 'WORLD'
                                category: 'hipay_vat_20_included'
                                amount: 0.2
                                included_in_price: true
                shipping_method:
                    options:
                        custom:
                            # 5.00 excluding tax + 20 % VAT = 6.00
                            colissimo_taxed:
                                code: 'colissimo_taxed'
                                name: 'Colissimo (taxed: 5.00 + 20% VAT)'
                                zone: 'WORLD'
                                enabled: true
                                tax_category: 'hipay_vat_20_excluded'
                                calculator:
                                    type: 'flat_rate'
                                    configuration:
                                        FASHION_WEB:
                                            amount: 500
                                        FASHION_WEB_PLN:
                                            amount: 500
                                        FASHION_WEB_USD:
                                            amount: 500
                                channels:
                                    - 'FASHION_WEB'
                                    - 'FASHION_WEB_PLN'
                                    - 'FASHION_WEB_USD'
                            ups:
                                code: 'ups'
                                name: 'UPS'
                                zone: 'WORLD'
                                enabled: true
                                channels:
                                    - 'FASHION_WEB'
                                    - 'FASHION_WEB_PLN'
                                    - 'FASHION_WEB_USD'
                            dhl_express:
                                code: 'dhl_express'
                                name: 'DHL Express'
                                zone: 'WORLD'
                                enabled: true
                                channels:
                                    - 'FASHION_WEB'
                            fedex:
                                code: 'fedex'
                                name: 'FedEx'
                                zone: 'WORLD'
                                enabled: true
                                channels:
                                    - 'FASHION_WEB'
                # HIPASYLU005-8: one coupon per basket case (Sylius accepts one coupon per cart).
                # The explicit rule matters: without rules the Sylius fixture draws a random
                # "cart_quantity" rule, so a coupon would only work above a random number of items.
                promotion:
                    options:
                        custom:
                            # Sylius default promotion (10.00 off carts above 100.00, applied automatically).
                            # It lasts 7 days and 10 uses by default: extended so that the expected
                            # amounts of large carts (Oney, Alma) stay the same over time.
                            new_year:
                                usage_limit: 100000
                                ends_at: '10 years'
                            hipay_cart_10_percent:
                                code: 'hipay_cart_10_percent'
                                name: 'HiPay basket: 10% off the cart'
                                channels: [ 'FASHION_WEB', 'FASHION_WEB_PLN', 'FASHION_WEB_USD' ]
                                exclusive: false
                                coupon_based: true
                                coupons:
                                    - { code: 'HIPAY10' }
                                rules:
                                    -   type: 'cart_quantity'
                                        configuration:
                                            count: 1
                                actions:
                                    -   type: 'order_percentage_discount'
                                        configuration:
                                            percentage: 10
                            hipay_cart_5_fixed:
                                code: 'hipay_cart_5_fixed'
                                name: 'HiPay basket: 5.00 off the cart'
                                channels: [ 'FASHION_WEB', 'FASHION_WEB_PLN', 'FASHION_WEB_USD' ]
                                exclusive: false
                                coupon_based: true
                                coupons:
                                    - { code: 'HIPAYFIXED5' }
                                rules:
                                    -   type: 'cart_quantity'
                                        configuration:
                                            count: 1
                                actions:
                                    -   type: 'order_fixed_discount'
                                        configuration:
                                            FASHION_WEB:
                                                amount: 5.00
                                            FASHION_WEB_PLN:
                                                amount: 5.00
                                            FASHION_WEB_USD:
                                                amount: 5.00
                            hipay_items_10_percent:
                                code: 'hipay_items_10_percent'
                                name: 'HiPay basket: 10% off each item'
                                channels: [ 'FASHION_WEB', 'FASHION_WEB_PLN', 'FASHION_WEB_USD' ]
                                exclusive: false
                                coupon_based: true
                                coupons:
                                    - { code: 'HIPAYITEM10' }
                                rules:
                                    -   type: 'cart_quantity'
                                        configuration:
                                            count: 1
                                actions:
                                    -   type: 'unit_percentage_discount'
                                        configuration:
                                            FASHION_WEB:
                                                percentage: 10
                                            FASHION_WEB_PLN:
                                                percentage: 10
                                            FASHION_WEB_USD:
                                                percentage: 10
                            hipay_cart_free:
                                code: 'hipay_cart_free'
                                name: 'HiPay basket: 100% off the cart'
                                channels: [ 'FASHION_WEB', 'FASHION_WEB_PLN', 'FASHION_WEB_USD' ]
                                exclusive: false
                                coupon_based: true
                                coupons:
                                    - { code: 'HIPAYFREE' }
                                rules:
                                    -   type: 'cart_quantity'
                                        configuration:
                                            count: 1
                                actions:
                                    -   type: 'order_percentage_discount'
                                        configuration:
                                            percentage: 100
                            hipay_shipping_50_percent:
                                code: 'hipay_shipping_50_percent'
                                name: 'HiPay basket: 50% off the shipping'
                                channels: [ 'FASHION_WEB', 'FASHION_WEB_PLN', 'FASHION_WEB_USD' ]
                                exclusive: false
                                coupon_based: true
                                coupons:
                                    - { code: 'HIPAYSHIP50' }
                                rules:
                                    -   type: 'cart_quantity'
                                        configuration:
                                            count: 1
                                actions:
                                    -   type: 'shipping_percentage_discount'
                                        configuration:
                                            percentage: 50
                            hipay_shipping_free:
                                code: 'hipay_shipping_free'
                                name: 'HiPay basket: free shipping'
                                channels: [ 'FASHION_WEB', 'FASHION_WEB_PLN', 'FASHION_WEB_USD' ]
                                exclusive: false
                                coupon_based: true
                                coupons:
                                    - { code: 'HIPAYSHIPFREE' }
                                rules:
                                    -   type: 'cart_quantity'
                                        configuration:
                                            count: 1
                                actions:
                                    -   type: 'shipping_percentage_discount'
                                        configuration:
                                            percentage: 100
                hipay_account:
