                              test_public_password: '%env(resolve:HIPAY_TEST_PUBLIC_PASSWORD)%'
                              debug_mode: true
                payment_method:
                    options:
                        custom:
                            -   code: 'hosted_page'
                                name: 'Hosted page'
                                channels: [ 'FASHION_WEB', 'FASHION_WEB_PLN', 'FASHION_WEB_USD' ]
                                usePayum: false
                                enabled: true
                                gatewayName: 'Hosted page'
                                gatewayFactory: 'hipay_hosted_page'
                                gatewayConfig:
                                    account: 'test_account_all_payment'
                                    payment_products:
                                        - 'card'
                                        - 'ideal'
                                        - 'bancontact'
                                        - 'paypal'
                                        - 'mbway'
                                        - 'alma-3x'
                                        - 'alma-4x'
                                        - 'multibanco'
                                        - 'przelewy24'
                                        - 'bancomatpay'
                                        - 'bizum'
                                        - 'credit-long'
                                        - '3xcb'
                                        - '3xcb-no-fees'
                                        - '4xcb'
                                        - '4xcb-no-fees'
                                    hosted_page:
                                        template: 'iframe_js'
                                        time_limit_to_pay: 3600
                                    product_configurations:
                                        card:
                                            enabled: true
                                            configuration:
                                                allowed_countries:
                                                    - 'FR'
