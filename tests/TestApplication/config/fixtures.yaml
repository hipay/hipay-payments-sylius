                                                button_height: 40
                                        mbway:
                                            enabled: true
                                            configuration:
                                                allowed_countries:
                                                    - 'PT'
                                                allowed_currencies:
                                                    - 'EUR'
                                                minimum_amount: 1
                                                maximum_amount: 5000000
                                        alma-3x:
                                            enabled: true
                                            configuration:
                                                allowed_countries:
                                                    - 'FR'
                                                allowed_currencies:
                                                    - 'EUR'
                                                minimum_amount: 1
                                                maximum_amount: 5000000
                                                expiration_limit: '1'
                                        alma-4x:
                                            enabled: false
                                            configuration:
                                                allowed_countries:
                                                    - 'FR'
                                                allowed_currencies:
                                                    - 'EUR'
                                                minimum_amount: 1
